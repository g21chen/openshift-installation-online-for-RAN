apiVersion: tuned.openshift.io/v1
kind: Tuned
metadata:
  annotations:
  name: performance-patch-master
  namespace: openshift-cluster-node-tuning-operator
spec:
  profile:
  - data: |
      [main]
      summary=Custom tuned profile to adjust performance
      include=openshift-node-performance-master-profile
      [bootloader]
      cmdline_removeKernelArgs=-nohz_full=${isolated_cores}
      [sysctl]
      net.core.rmem_default = 425984
      net.core.rmem_max = 425984
      net.sctp.sctp_rmem = "8192 1731000 8388608"
      net.sctp.sndbuf_policy = 1
      net.sctp.rcvbuf_policy = 1
    name: performance-patch-master
  recommend:
  - machineConfigLabels:
      machineconfiguration.openshift.io/role: master
    priority: 19
    profile: performance-patch-master
