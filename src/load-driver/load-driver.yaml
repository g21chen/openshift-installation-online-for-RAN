apiVersion: machineconfiguration.openshift.io/v1
kind: MachineConfig
metadata:
  labels:
    machineconfiguration.openshift.io/role: master
  name: load-kernel-modules-master
spec:
  config:
    ignition:
      version: 3.2.0
    storage:
      files:
      - contents:
          source: data:,
          verification: {}
        filesystem: root
        mode: 420
        overwrite: true
        path: /etc/modprobe.d/sctp-blacklist.conf
      - contents:
          source: data:text/plain;charset=utf-8,sctp
        filesystem: root
        mode: 420
        path: /etc/modules-load.d/sctp-load.conf
      - contents:
          source: data:text/plain;charset=utf-8,nft_ct
        filesystem: root
        mode: 420
        overwrite: true
        path: /etc/modules-load.d/nft_ct-load.conf
      - contents:
          source: data:text/plain;charset=utf-8,nft_limit
        filesystem: root
        mode: 420
        overwrite: true
        path: /etc/modules-load.d/nft_limit-load.conf
      - contents:
          source: data:text/plain;charset=utf-8,nft_log
        filesystem: root
        mode: 420
        overwrite: true
        path: /etc/modules-load.d/nft_log-load.conf
      - contents:
          source: data:text/plain;charset=utf-8,nft_nat
        filesystem: root
        mode: 420
        overwrite: true
        path: /etc/modules-load.d/nft_nat-load.conf
      - contents:
          source: data:text/plain;charset=utf-8,nfnetlink_log
        filesystem: root
        mode: 420
        overwrite: true
        path: /etc/modules-load.d/nfnetlink_log-load.conf
      - contents:
          source: data:text/plain;charset=utf-8,ip_gre
        filesystem: root
        mode: 420
        overwrite: true
        path: /etc/modules-load.d/ip_gre_load.conf
      - contents:
          source: data:text/plain;charset=utf-8,ip6_gre
        filesystem: root
        mode: 420
        overwrite: true
        path: /etc/modules-load.d/ip6_gre_load.conf
      - contents:
          source: data:text/plain;charset=utf-8,bridge
        filesystem: root
        mode: 420
        overwrite: true
        path: /etc/modules-load.d/bridge-load.conf
      - contents:
          source: data:text/plain;charset=utf-8,vfio_pci
        filesystem: root
        mode: 420
        overwrite: true
        path: /etc/modules-load.d/vfio_pci.conf
      - contents:
          source: data:text/plain;charset=utf-8,act_bpf
        filesystem: root
        mode: 420
        overwrite: true
        path: /etc/modules-load.d/act_bpf.conf

